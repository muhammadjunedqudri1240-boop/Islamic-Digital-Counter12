name: Build Smart Tasbeeh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: PORT=3000 BASE_PATH=/ pnpm --filter ./artifacts/smart-tasbeeh-pro build

      - name: Sync Capacitor Android
        run: pnpm --filter ./artifacts/smart-tasbeeh-pro exec cap sync android

      - name: Build debug APK
        working-directory: artifacts/smart-tasbeeh-pro/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Tasbeeh-APK
          path: artifacts/smart-tasbeeh-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
